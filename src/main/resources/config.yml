# kZones Configuration

# Define your zone sequences here
# Each sequence is a list of WorldGuard region names in order
# Players must follow this order when moving through regions
zone-sequences:
  # Example sequence:
  # sequence1:
  #   - "spawn"
  #   - "tutorial_1"
  #   - "tutorial_2"
  #   - "arena"

# Movement restrictions
restrictions:
  # Prevent players from going backward in the sequence
  # If true, players cannot re-enter previous zones
  prevent-backward-movement: true
  
  # Prevent players from leaving their current zone
  # If true, players must wait for admin to progress them
  prevent-leaving-current-zone: true
  
  # Allow free movement after reaching target
  # If true, players can move freely after reaching the target zone
  free-movement-after-target: true

# Target zone settings
# Set a specific target zone that all players must reach
target:
  # Enable target zone feature
  enabled: false
  # Target zone name (must be in the sequence)
  zone: ""
  # Automatically progress players to target when sequence starts
  auto-progress-to-target: false

# Teleport settings
teleport:
  # How far back to teleport players (in blocks)
  pushback-distance: 2.0
  # Show particles when teleporting
  show-particles: true
  # Play sound when teleporting
  play-sound: true
  # Sound to play (leave empty to disable)
  sound: "ENTITY_ENDERMAN_TELEPORT"

# Messages
messages:
  # Message when player tries to enter wrong region
  wrong-sequence: "&cYou cannot enter this region yet! Follow the correct sequence."
  # Message when player tries to leave current region
  cannot-leave: "&cYou must complete this zone before moving on!"
  # Message when player tries to go backward
  cannot-go-backward: "&cYou cannot go backward! Continue moving forward."
  # Message when sequence starts
  sequence-started: "&aZone sequence started! Follow the path."
  # Message when sequence stops
  sequence-stopped: "&eZone sequence stopped."
  # Message when moved to next zone
  next-zone: "&aYou can now proceed to the next zone!"
  # Message when target zone is set
  target-set: "&aTarget zone set to: &e{zone}"
  # Message when target zone is reached
  target-reached: "&aYou have reached the target zone!"
  # Prefix for all messages
  prefix: "&8[&6kZones&8]&r "

# Debug mode (shows detailed information)
debug: false
