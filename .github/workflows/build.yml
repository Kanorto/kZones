name: Build and Release

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # For creating releases and pushing commits
      packages: read   # For reading packages
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      
      - name: Get current version
        id: get_version
        run: |
          CURRENT_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          echo "Current version: $CURRENT_VERSION"
      
      - name: Calculate next version
        id: next_version
        run: |
          CURRENT_VERSION="${{ steps.get_version.outputs.current_version }}"
          # Remove -SNAPSHOT if present
          BASE_VERSION="${CURRENT_VERSION%-SNAPSHOT}"
          
          # Split version into components
          IFS='.' read -ra VERSION_PARTS <<< "$BASE_VERSION"
          MAJOR="${VERSION_PARTS[0]}"
          MINOR="${VERSION_PARTS[1]}"
          PATCH="${VERSION_PARTS[2]}"
          
          # Increment patch version
          PATCH=$((PATCH + 1))
          
          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "Next version: $NEW_VERSION"
      
      - name: Update version in pom.xml
        run: |
          NEW_VERSION="${{ steps.next_version.outputs.new_version }}"
          mvn versions:set -DnewVersion=$NEW_VERSION -DgenerateBackupPoms=false
      
      - name: Build with Maven
        run: mvn clean package -DskipTests
      
      - name: Get artifact name
        id: get_artifact
        run: |
          ARTIFACT_NAME=$(ls target/*.jar | grep -v original | head -n 1)
          echo "artifact_path=$ARTIFACT_NAME" >> $GITHUB_OUTPUT
          echo "artifact_name=$(basename $ARTIFACT_NAME)" >> $GITHUB_OUTPUT
      
      - name: Create Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.next_version.outputs.new_version }}
          name: Release v${{ steps.next_version.outputs.new_version }}
          body: |
            ## kZones v${{ steps.next_version.outputs.new_version }}
            
            Automatic build of kZones plugin for Minecraft 1.21.4
            
            ### What's New
            - See [CHANGELOG.md](CHANGELOG.md) for details
            
            ### Installation
            1. Download the JAR file below
            2. Place it in your server's `plugins/` folder
            3. Restart your server
            4. Configure in `plugins/kZones/config.yml`
            
            ### Requirements
            - Minecraft Server 1.21.4 or compatible
            - Java 21 or higher
            - WorldGuard plugin
            - WorldEdit plugin
          files: ${{ steps.get_artifact.outputs.artifact_path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Commit version update
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add pom.xml
          git commit -m "chore: bump version to ${{ steps.next_version.outputs.new_version }} [skip ci]" || echo "No changes to commit"
          git push || echo "No changes to push"
